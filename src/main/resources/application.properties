jmix.core.default-file-storage=fs
jmix.awsfs.bucket=demo
jmix.awsfs.region=us-east-1

# Folder of the S3 bucket the employee photos are kept in — the only folder scanned for them,
# so the rest of the bucket costs nothing to skip and cannot be mistaken for a photo.
# An empty value searches the whole bucket. Does not apply to the local storage of the Dev
# profile, whose photos must sit in the yyyy/MM/dd layout LocalFileStorage can address.
umida.employee-photos.s3-folder=employee_photos

jmix.ui.login-view-id=umida_LoginView
jmix.ui.main-view-id=umida_MainView
jmix.ui.menu-config=/uz/kapitalbank/umida/menu.xml
jmix.ui.composite-menu=false

ui.login.defaultUsername=admin
ui.login.defaultPassword=admin

# LDAP authentication (Jmix LDAP add-on). Only the users listed in standard-authentication-users
# log in with the password stored in the database; everyone else is authenticated by an LDAP bind.
# An LDAP user missing from the database is created on the first login, and its name and e-mail
# are refreshed from LDAP on every login (LdapUserSynchronizationStrategy).
jmix.ldap.standard-authentication-users=admin,system
jmix.ldap.urls=ldap://localhost:${spring.ldap.embedded.port}
jmix.ldap.base-dn=dc=kapitalbank,dc=uz
jmix.ldap.manager-dn=cn=manager,dc=kapitalbank,dc=uz
jmix.ldap.manager-password=manager
jmix.ldap.user-search-base=ou=users
jmix.ldap.user-search-filter=(uid={0})
jmix.ldap.username-attribute=uid
# Roles stay assigned in the application (Role assignments), LDAP groups are not mapped to roles.
jmix.ldap.synchronize-role-assignments=false
# Lets every LDAP user into the UI; the remaining roles are assigned in the application.
jmix.ldap.default-roles=ui-minimal

# Embedded LDAP server (UnboundID) imitating the corporate directory. Its users come from the LDIF,
# which mirrors the employees with an AD account. To use a real directory instead, remove the
# spring.ldap.embedded.* properties and point the jmix.ldap.* ones at it (for Active Directory also
# set jmix.ldap.use-active-directory-configuration=true and jmix.ldap.active-directory-domain).
spring.ldap.embedded.base-dn=dc=kapitalbank,dc=uz
spring.ldap.embedded.ldif=classpath:ldap/umida-users.ldif
# 0 = a free port picked at startup (EmbeddedLdapPortEnvironmentPostProcessor, see "Embedded LDAP server port"
# in the log); set a fixed one to browse the directory with an LDAP client.
spring.ldap.embedded.port=0
spring.ldap.embedded.credential.username=cn=manager,dc=kapitalbank,dc=uz
spring.ldap.embedded.credential.password=manager

jmix.core.available-locales=ru,uz,en

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=false

logging.level.org.atmosphere=warn

# 'debug' level logs SQL generated by EclipseLink ORM
logging.level.eclipselink.logging.sql=info

# 'debug' level logs data store operations
logging.level.io.jmix.core.datastore=info

# 'debug' level logs access control constraints
logging.level.io.jmix.core.AccessLogger=debug

# 'debug' level logs all Jmix debug output
logging.level.io.jmix=info

# 'debug' or 'trace' levels help to troubleshoot security problems
logging.level.org.springframework.security=info
jmix.ui.navigation.use-nanoseconds-in-url-params=false
jmix.eclipselink.use-inner-join-in-condition=true