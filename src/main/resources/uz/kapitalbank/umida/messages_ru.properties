uz.kapitalbank.umida.view.report.parameter/parameters.defaultValue=Значение по умолчанию
uz.kapitalbank.umida.view.report.parameter/parameters.localeTextHelp.header= Локализация
uz.kapitalbank.umida.view.report.parameter/parameters.localeTextHelp.text=<div>Здесь вы можете задать название отчета. В списке отчетов для запуска отчет\
  <br/>будет отображаться с названием на языке, с которым пользователь вошел в\
  <br/>систему. Введите в отдельных строках текстового поля пары:</code>\
  <br/><code>имя_локали = название_отчета</code>.\
  <br/>\
  <br/>Например:\
  <br/><code>en = Books by author</code>\
  <br/><code>ru = Книги по автору</code>\
  </div>
uz.kapitalbank.umida.view.report.parameter/parameters.transformationScriptHelp.header= Трансформация
uz.kapitalbank.umida.view.report.parameter/parameters.transformationScriptHelp.text=<div>Здесь вы можете определить скрипт Groovy для преобразования параметра\
  <br/>перед использованием его в отчёте. Скрипт Groovy должен возвращать\
  <br/>новое значение параметра. Текущее значение доступно по алиасу\
  <br/><code>paramValue</code>, мэп параметров можно получить с помощью алиаса <code>params</code>.\
  <br/>\
  <br/>Например:\
  <br/><code>return "%" + paramValue + "%"</code>\
</div>
uz.kapitalbank.umida.view.report.parameter/parameters.lookupJoinHelp.header=Оператор Join
uz.kapitalbank.umida.view.report.parameter/parameters.lookupJoinHelp.text=<div>Значение данного поля добавляется в выражение "from" запроса. Оно должно начинаться с запятой, "join" или "left join".\
  <br/>В качестве алиаса извлекаемой сущности необходимо использовать строку {E}. При выполнении запросов она будет заменена на реальный алиас, заданный в запросе.\
  <br/>\
  <br/>Например:\
  <br/><code>join {E}.seller s</code>\
</div>
uz.kapitalbank.umida.view.report.parameter/parameters.lookupWhereHelp.header=Оператор Where
uz.kapitalbank.umida.view.report.parameter/parameters.lookupWhereHelp.text=<div>Значение данного поля добавляется в выражение "where" запроса по условию "and" (И). Само слово "where" писать не нужно, оно будет добавлено автоматически, даже если исходный запрос его не содержал.\
  <br/>В качестве алиаса извлекаемой сущности необходимо использовать строку {E}. При выполнении запросов она будет заменена на реальный алиас, заданный в запросе.\
  <br/>\
  <br/>Например:\
  <br/><code>{E}.salary > 1000 and {E}.department = 'abc'</code>\
</div>
uz.kapitalbank.umida.view.report.parameter/validationException.message=Пожалуйста, заполните обязательные поля
uz.kapitalbank.umida.view.report.parameter/error.paramIsRequiredButEmpty=Заполните поле "%s"
