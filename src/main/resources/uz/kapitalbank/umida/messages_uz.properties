uz.kapitalbank.umida.view.report.parameter/parameters.defaultValue=Default value
uz.kapitalbank.umida.view.report.parameter/parameters.localeTextHelp.header= Localization
uz.kapitalbank.umida.view.report.parameter/parameters.localeTextHelp.text=<div>Here you can define the parameter name for different locales. In order to do this\
  <br/>you should enter the pairs <code>locale_name = report_name</code>.\
  <br/>\
  <br/> For example:\
  <br/><code>en = Book</code>\
  <br/><code>ru = Книга</code>\
  </div>
uz.kapitalbank.umida.view.report.parameter/parameters.transformationScriptHelp.header= Transformation
uz.kapitalbank.umida.view.report.parameter/parameters.transformationScriptHelp.text=<div>Allows you to apply a Groovy script on the parameter before using it in the\
  <br/>report. A Groovy script should return new parameter value. Current parameter\
  <br/>value is available in the script by the <code>paramValue</code>, the parameters map is\
  <br/>available by alias <code>params</code>.\
  <br/>\
  <br/>For example:\
  <br/><code>return "%" + paramValue + "%"</code>\
  </div>
uz.kapitalbank.umida.view.report.parameter/parameters.lookupJoinHelp.header=Join clause
uz.kapitalbank.umida.view.report.parameter/parameters.lookupJoinHelp.text=<div>A value of this field is added to the "from" query clause. It should begin with a comma, "join" or "left join".\
  <br/>The {E} placeholder should be used as an alias of the entity being extracted. On execution of the query, it will be replaced with a real alias, specified in the query.\
  <br/>\
  <br/>For example:\
  <br/><code>join {E}.seller s</code>\
  </div>
uz.kapitalbank.umida.view.report.parameter/parameters.lookupWhereHelp.header=Where clause
uz.kapitalbank.umida.view.report.parameter/parameters.lookupWhereHelp.text=<div>A value of this field is added to the "where" query clause using "and" condition. The "where" word is not needed, as it will be added automatically.\
  <br/>The {E} placeholder should be used as an alias of the entity being extracted. On execution of the query, it will be replaced with a real alias, specified in the query.\
  <br/>\
  <br/>For example:\
  <br/><code>{E}.salary > 1000 and {E}.department = 'abc'</code>\
  </div>
