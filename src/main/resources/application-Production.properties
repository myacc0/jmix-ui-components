jmix.core.default-file-storage=s3

# MinIO object storage (docker-compose service `minio`, S3 API on port 9000).
# The bucket `demo`, the folder `employee_photos` and this user are created by the
# `minio-init` service; the MinIO console is at http://localhost:9001 (minioadmin / minio1234).
jmix.awsfs.endpoint-url=http://localhost:9000
jmix.awsfs.bucket=demo
jmix.awsfs.region=us-east-1
jmix.awsfs.access-key=demo-access-key
jmix.awsfs.secret-access-key=demo-secret-access-key
# MinIO serves buckets as a path (http://host:9000/demo/...), not as a virtual host
# (http://demo.host:9000/...), so path-style addressing is mandatory here.
jmix.awsfs.use-path-style-bucket-addressing=true