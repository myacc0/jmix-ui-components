services:
  postgres:
    image: "postgres:16.1"
    container_name: "jmix-postgres"
    restart: always
    ports:
      - "15432:5432"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=psql1234
    volumes:
      - jmix-main-db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s

  postgres-dwh:
     image: "postgres:16.1"
     container_name: "jmix-dwh"
     restart: always
     ports:
       - "16432:5432"
     environment:
       - POSTGRES_DB=dwh
       - POSTGRES_USER=dwh_reporting
       - POSTGRES_PASSWORD=qweasd123
     volumes:
       - jmix-dwh-db:/var/lib/postgresql/data
     healthcheck:
       test: [ "CMD-SHELL", "pg_isready -U dwh_reporting -d dwh" ]
       interval: 30s
       timeout: 60s
       retries: 5
       start_period: 80s

  postgres-dwh-olap:
    image: "postgres:16.1"
    container_name: "jmix-dwh-olap"
    restart: always
    ports:
      - "16433:5432"
    environment:
      - POSTGRES_DB=dwh
      - POSTGRES_USER=dwh_reporting
      - POSTGRES_PASSWORD=qweasd123
    volumes:
      - jmix-dwh-olap-db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dwh_reporting -d dwh" ]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s

  # Additional data store. DB `dwh`, user `dwh_reporting` / `qweasd123` on port 9030
  # are created by starrocks-init.sql (StarRocks stores them in the FE meta volume,
  # so re-apply that script if jmix-starrocks-fe-meta is ever removed).
  starrocks:
    image: "starrocks/allin1-ubuntu:3.5-latest"
    container_name: "jmix-starrocks"
    restart: always
    ports:
      - "9030:9030"
      - "8030:8030"
      - "8040:8040"
    volumes:
      - jmix-starrocks-fe-meta:/data/deploy/starrocks/fe/meta
      - jmix-starrocks-be-storage:/data/deploy/starrocks/be/storage
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: [ "CMD-SHELL", "mysql -u root -h 127.0.0.1 -P 9030 -e 'SHOW FRONTENDS\\G' | grep -q 'Alive: true'" ]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 120s

  # Object storage for Jmix file storage (add-on `io.jmix.awsfs:jmix-awsfs-starter`).
  # S3 API on port 9000, web console on port 9001 (root user `minioadmin` / `minio1234`).
  # The application does NOT use the root credentials — `minio-init` creates the `demo`
  # bucket, the `employee_photos` folder and a dedicated `demo-access-key` MinIO user
  # whose keys are in application.properties (`jmix.awsfs.*`).
  minio:
    image: "minio/minio:RELEASE.2025-09-07T16-13-09Z"
    container_name: "jmix-minio"
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minio1234
    volumes:
      - jmix-minio-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 20s

  # One-shot bootstrap: bucket, folder and the application credentials.
  # Every step is idempotent, so re-running `docker-compose up -d` is safe.
  minio-init:
    image: "minio/mc:RELEASE.2025-08-13T08-35-41Z"
    container_name: "jmix-minio-init"
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minio1234 &&
      mc mb --ignore-existing local/demo &&
      mc mb --ignore-existing local/demo/employee_photos &&
      (mc admin user add local demo-access-key demo-secret-access-key || true) &&
      mc admin policy attach local readwrite --user demo-access-key || true
      "

  adminer:
    image: adminer
    container_name: "jmix-adminer"
    restart: always
    ports:
      - 8090:8080

volumes:
  jmix-main-db:
    driver: local
  jmix-dwh-db:
     driver: local
  jmix-dwh-olap-db:
    driver: local
  jmix-starrocks-fe-meta:
    driver: local
  jmix-starrocks-be-storage:
    driver: local
  jmix-minio-data:
    driver: local
